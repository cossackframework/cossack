packages:
  - packages/*
  - examples/*

nodeLinker: hoisted

allowBuilds:
  '@bitdisaster/exe-icon-extractor': true
  better-sqlite3: true
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  sharp: true
  usocket: set this to true or false
  workerd: true

overrides:
  '@electron/rebuild': ^4.2.0

minimumReleaseAgeExclude:
  - electron@43.3.0
