name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Deno 2.9
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace libraries
        run: pnpm run build

      - name: Check and build Deno adapter example
        run: |
          deno check packages/deno-adapter/src/index.ts
          deno test -A packages/deno-adapter/tests/deno-smoke.test.ts
          pnpm --filter @cossackframework/example-deno-desktop-counter build

      - name: Package Deno Desktop example for Linux
        working-directory: examples/deno-desktop-counter
        run: deno task desktop:build

      - name: Test generated app with local package tarballs
        run: pnpm run test:scaffold:local

      - name: Install Playwright browsers
        run: pnpm --filter @cossackframework/framework exec playwright install --with-deps

      - name: Run E2E tests
        run: |
          pnpm --filter @cossackframework/framework run test:e2e
          pnpm --filter @cossackframework/studio exec playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            packages/framework/playwright-report/
            packages/studio/playwright-report/
          retention-days: 30
