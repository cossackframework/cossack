name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build core packages
        run: |
          pnpm --filter @cossackframework/core build
          pnpm --filter @cossackframework/renderer build
          pnpm --filter @cossackframework/node-adapter build

      - name: Install Playwright browsers
        run: pnpm --filter @cossackframework/framework exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm --filter @cossackframework/framework run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/framework/playwright-report/
          retention-days: 30
