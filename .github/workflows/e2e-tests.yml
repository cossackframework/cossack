name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect optional test changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          desktop=false
          generated_app=false
          studio=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            # Be conservative when GitHub does not provide a usable base commit.
            desktop=true
            generated_app=true
            studio=true
          else
            # Shared dependencies and CI changes affect every optional suite.
            if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              package.json pnpm-lock.yaml pnpm-workspace.yaml .github/workflows; then
              desktop=true
              generated_app=true
              studio=true
            fi
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              examples/desktop-counter \
              packages/desktop || desktop=true
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              packages/core \
              packages/renderer \
              packages/framework \
              packages/node-adapter \
              packages/auth \
              packages/database \
              packages/test-utils \
              packages/ui \
              packages/scaffold \
              packages/cossack \
              scripts/test-local-scaffold.mjs \
              scripts/verify-agent-documentation.mjs \
              scripts/verify-agent-guide-batch.mjs \
              scripts/verify-published-release.mjs \
              scripts/verify-deployment-guide.mjs \
              scripts/verify-generated-migration-plans.mjs \
              docs/deployment.md \
              docs/installation.md || generated_app=true
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              packages/studio packages/core packages/renderer packages/framework \
              packages/node-adapter packages/database packages/ui || studio=true
          fi

          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "generated_app=$generated_app" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm run build

      # Includes Desktop: its typecheck and unit tests mock Electron and run on
      # Linux. Only the platform installers (desktop.yml) stay manual.
      - name: Check package types
        run: pnpm run typecheck

      - name: Install Chromium and recording dependencies
        run: pnpm --filter @cossackframework/framework exec playwright install chromium --with-deps

      - name: Run all unit tests
        run: pnpm run test:unit

      - name: Test generated app with local package tarballs
        if: steps.changes.outputs.generated_app == 'true'
        run: pnpm run test:scaffold:local

      - name: Run Framework E2E tests
        run: pnpm --filter @cossackframework/framework run test:e2e
        env:
          CI: true

      # The default e2e run builds the app and includes the SSG spec; this checks the emitted files.
      - name: Check Framework SSG output
        run: pnpm --filter @cossackframework/framework exec vitest run tests/ssg-build.test.ts
        env:
          CI: true

      - name: Run Studio E2E tests
        if: steps.changes.outputs.studio == 'true'
        run: pnpm --filter @cossackframework/studio exec playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('packages/framework/playwright-report/**', 'packages/studio/playwright-report/**', 'packages/framework/test-results/**', 'packages/studio/test-results/**') != '' }}
        with:
          name: playwright-report
          path: |
            packages/framework/playwright-report/
            packages/studio/playwright-report/
            packages/framework/test-results/
            packages/studio/test-results/
          retention-days: 30
