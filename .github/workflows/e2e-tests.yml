name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect optional test changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          desktop=false
          generated_app=false
          studio=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            # Be conservative when GitHub does not provide a usable base commit.
            desktop=true
            generated_app=true
            studio=true
          else
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              examples/desktop-counter \
              packages/desktop || desktop=true
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              packages/core \
              packages/renderer \
              packages/framework \
              packages/node-adapter \
              packages/deno-adapter \
              packages/auth \
              packages/database \
              packages/test-utils \
              packages/ui \
              packages/scaffold \
              packages/cossack \
              scripts/test-local-scaffold.mjs \
              scripts/verify-agent-documentation.mjs \
              scripts/verify-agent-guide-batch.mjs \
              scripts/verify-published-release.mjs \
              scripts/verify-deployment-guide.mjs \
              scripts/verify-generated-migration-plans.mjs \
              docs/deployment.md \
              docs/installation.md || generated_app=true
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              packages/studio || studio=true
          fi

          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "generated_app=$generated_app" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Deno 2.9
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace libraries
        run: pnpm run build

      - name: Check package types
        run: pnpm run typecheck

      - name: Install Playwright browsers
        run: pnpm --filter @cossackframework/framework exec playwright install --with-deps

      - name: Run all unit tests
        run: pnpm run test:unit

      - name: Check Deno web adapter
        run: |
          deno check packages/deno-adapter/src/index.ts
          deno test -A packages/deno-adapter/tests/deno-smoke.test.ts

      - name: Build Desktop counter web target
        if: steps.changes.outputs.desktop == 'true'
        run: pnpm --filter @cossackframework/example-desktop-counter build

      - name: Test generated app with local package tarballs
        if: steps.changes.outputs.generated_app == 'true'
        run: pnpm run test:scaffold:local

      - name: Run Framework E2E tests
        run: pnpm --filter @cossackframework/framework run test:e2e
        env:
          CI: true

      # The default e2e run builds the app and includes the SSG spec; this checks the emitted files.
      - name: Check Framework SSG output
        run: pnpm --filter @cossackframework/framework exec vitest run tests/ssg-build.test.ts
        env:
          CI: true

      - name: Run Studio E2E tests
        if: steps.changes.outputs.studio == 'true'
        run: pnpm --filter @cossackframework/studio exec playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            packages/framework/playwright-report/
            packages/studio/playwright-report/
          retention-days: 30
