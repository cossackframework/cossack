name: Integration Tests

# Heavy tests that scaffold, build and run generated applications on Node,
# workerd and Chromium, and the database suites against real PostgreSQL and
# MySQL servers. They run:
# - on PRs that touch any workspace package, the repository scripts or the
#   dependency manifests (generated apps link every library package, so a
#   core/renderer/framework/database/auth change affects them too),
# - on every push to master,
# - nightly (catches drift in Wrangler, workerd and browsers),
# - before every release (called from publish.yml).
# Fast checks (typecheck, unit, e2e) run on every PR in e2e-tests.yml.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    paths:
      - packages/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/integration-tests.yml
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Superseded PR runs are cancelled; master, nightly and release runs are not.
  group: integration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI integration (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm run build

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the Playwright version, which pins the browser builds. With a
      # cache hit the install below skips the download and only adds system
      # libraries (--with-deps), which the cache does not hold.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        run: pnpm --filter cossack exec playwright install chromium --with-deps

      - name: Run CLI integration tests
        run: pnpm --filter cossack run test:integration --shard=${{ matrix.shard }}/4
        env:
          CI: true

  ui-browser:
    name: UI browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm run build

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the Playwright version, which pins the browser builds. With a
      # cache hit the install below skips the download and only adds system
      # libraries (--with-deps), which the cache does not hold.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        run: pnpm --filter @cossackframework/ui exec playwright install chromium --with-deps

      - name: Run UI browser tests
        run: pnpm --filter @cossackframework/ui run test:browser
        env:
          CI: true

  database-live:
    name: Database live suites (PostgreSQL, MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Images are pinned by tag and multi-arch index digest. Update both
    # together: docker buildx imagetools inspect postgres:18.x / mysql:8.0.x.
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: cossack
          POSTGRES_PASSWORD: cossack
          POSTGRES_DB: cossack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cossack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: cossack
          MYSQL_DATABASE: cossack_test
          # A non-UTC server time zone. The MySQL adapter must still read and
          # write UTC (it sets the session time zone), and the Hyperdrive MySQL
          # target reports its documented skip for DEFAULT CURRENT_TIMESTAMP.
          TZ: Asia/Bangkok
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcossack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: true
      COSSACK_TEST_POSTGRES_URL: postgres://cossack:cossack@127.0.0.1:5432/cossack_test
      COSSACK_TEST_MYSQL_URL: mysql://root:cossack@127.0.0.1:3306/cossack_test
      # Fail, never skip, when a live URL is missing (packages/database/test/live-urls.ts).
      COSSACK_TEST_REQUIRE_LIVE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm run build

      - name: Run database tests against PostgreSQL and MySQL
        run: pnpm --filter @cossackframework/database run test --watch=false
