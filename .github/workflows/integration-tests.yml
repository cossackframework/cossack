name: Integration Tests

# Heavy tests that scaffold, build and run generated applications on Node,
# workerd and Chromium. They run:
# - on PRs that touch the CLI, scaffold, adapters or UI components,
# - on every push to master (covers core/framework changes after merge),
# - nightly (catches drift in Wrangler, workerd and browsers),
# - before every release (called from publish.yml).
# Fast checks (typecheck, unit, e2e) run on every PR in e2e-tests.yml.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    paths:
      - packages/cossack/**
      - packages/scaffold/**
      - packages/node-adapter/**
      - packages/ui/**
      - .github/workflows/integration-tests.yml
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  workflow_call:

concurrency:
  # Superseded PR runs are cancelled; master, nightly and release runs are not.
  group: integration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI integration (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm run build

      - name: Install Chromium
        run: pnpm --filter cossack exec playwright install chromium --with-deps

      - name: Run CLI integration tests
        run: pnpm --filter cossack run test:integration --shard=${{ matrix.shard }}/4
        env:
          CI: true

  ui-browser:
    name: UI browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm run build

      - name: Install Chromium
        run: pnpm --filter @cossackframework/ui exec playwright install chromium --with-deps

      - name: Run UI browser tests
        run: pnpm --filter @cossackframework/ui run test:browser
        env:
          CI: true
