name: Publish to npm

on:
  release:
    types: [published]
  # Retry publication from master without moving an existing release tag.
  workflow_dispatch:

# Jobs widen this only where needed (publish adds id-token: write for OIDC).
permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release tag and versions
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release tag, branch and package versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = release ]; then
            if [ "$TARGET_COMMITISH" != master ]; then
              echo "::error::Release targets '$TARGET_COMMITISH'; releases must target master."
              exit 1
            fi
            # target_commitish is only a label; also require the tagged commit to be on master.
            status="$(gh api "repos/$REPOSITORY/compare/master...$GITHUB_SHA" --jq .status)"
            case "$status" in
              identical|behind) ;;
              *) echo "::error::Release commit $GITHUB_SHA is not on master (compare status: $status)."; exit 1 ;;
            esac
            tag="$GITHUB_REF_NAME"
          else
            # A manual retry may only publish a version that already has a release tag.
            version="$(node -p "require('./package.json').version")"
            tag=""
            for candidate in "$version" "v$version"; do
              if gh api "repos/$REPOSITORY/git/ref/tags/$candidate" --silent 2>/dev/null; then
                tag="$candidate"
                break
              fi
            done
            if [ -z "$tag" ]; then
              echo "::error::No release tag $version or v$version exists; publish a GitHub release first."
              exit 1
            fi
          fi
          node scripts/verify-release-version.mjs "$tag"

  # The automated test suites run before anything is published. The OIDC job
  # below then only installs, builds, audits the database bundle and publishes.
  #
  # CLI integration shards and UI browser tests.
  integration:
    needs: verify-release
    uses: ./.github/workflows/integration-tests.yml

  # Typecheck and unit tests of every package (Desktop included), the
  # generated-app run against local tarballs, and the Framework (including
  # SSG output) and Studio Playwright suites. The Linux Desktop runtime gate
  # (pnpm test:desktop) and the platform installers (desktop.yml) stay manual.
  e2e:
    needs: verify-release
    uses: ./.github/workflows/e2e-tests.yml

  publish:
    needs: [verify-release, integration, e2e]
    runs-on: ubuntu-24.04
    # Must exactly match the environment in each npm trusted publisher.
    environment: Publish to npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages with dist output
        run: pnpm run build

      # Tests ran in the integration and e2e jobs on this commit. The bundle
      # audit checks the database build that this job publishes.
      - name: Audit database bundle
        run: pnpm --filter @cossackframework/database audit:bundle

      # pnpm 11 supports npm trusted publishing through GitHub OIDC.
      # Configure publish.yml as a trusted publisher for each package on npm.
      # Do not inject NPM_TOKEN: publishing must use the workflow identity.
      #
      # pnpm -r publish publishes every non-private workspace package in
      # topological order (dependencies first) and skips versions that are
      # already on the registry, so a failed run can simply be re-run.
      # Private packages (root, @cossackframework/test-utils, examples/*) are skipped.
      #
      # cossack is published in a second pass: framework devDepends on cossack
      # and cossack depends on framework, so pnpm breaks that cycle arbitrarily
      # and could publish cossack before the framework version it requires.
      - name: Publish workspace packages
        run: |
          pnpm -r --filter '!cossack' publish --access public --no-git-checks
          pnpm -r --filter cossack publish --access public --no-git-checks
