name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages with dist output
        run: pnpm run build

      - name: Build framework types
        run: pnpm --filter @cossackframework/framework build:types

      - name: Run tests
        run: |
          pnpm --filter @cossackframework/core test -- --run
          pnpm --filter @cossackframework/renderer test -- --run
          pnpm --filter @cossackframework/deno-adapter test
          pnpm --filter @cossackframework/desktop test
          pnpm --filter @cossackframework/ui test -- --run
          pnpm --filter @cossackframework/database test
          pnpm --filter @cossackframework/database audit:bundle
          pnpm --filter @cossackframework/framework test --run tests/
          pnpm --filter @cossackframework/studio test
          pnpm --filter @cossackframework/scaffold test
          pnpm --filter cossack test

      - name: Test generated app with local package tarballs
        run: pnpm run test:scaffold:local

      - name: Publish @cossackframework/renderer
        run: pnpm publish --filter @cossackframework/renderer --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @cossackframework/core
        run: pnpm publish --filter @cossackframework/core --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @cossackframework/node-adapter
        run: pnpm publish --filter @cossackframework/node-adapter --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @cossackframework/auth
        run: pnpm publish --filter @cossackframework/auth --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # framework depends on the UI workspace package, so publish UI first.
      - name: Publish @cossackframework/ui
        run: pnpm publish --filter @cossackframework/ui --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @cossackframework/framework
        run: pnpm publish --filter @cossackframework/framework --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @cossackframework/deno-adapter
        run: pnpm publish --filter @cossackframework/deno-adapter --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @cossackframework/desktop
        run: pnpm publish --filter @cossackframework/desktop --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @cossackframework/database
        run: pnpm publish --filter @cossackframework/database --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Studio ships a prebuilt Cossack app and depends on the database
      # workspace package, UI, and framework.
      - name: Publish @cossackframework/studio
        run: pnpm publish --filter @cossackframework/studio --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @cossackframework/scaffold
        run: pnpm publish --filter @cossackframework/scaffold --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # cossack must publish LAST: it depends on @cossackframework/framework and
      # @cossackframework/scaffold, both of which are published above. It is plain JS
      # (no build step) — ships bin/ and src/ directly.
      - name: Publish cossack
        run: pnpm publish --filter cossack --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
