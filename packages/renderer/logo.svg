<svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC107" /> <stop offset="100%" stop-color="#FF9800" /> </linearGradient>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <path d="M 75 25 
           L 65 25 
           Q 30 25 30 50 
           Q 30 75 65 75 
           L 75 75 
           Q 80 75 80 85 
           Q 80 95 65 95 
           Q 10 95 10 50 
           Q 10 5 65 5 
           Q 80 5 80 15 
           Q 80 25 75 25 Z" 
        fill="url(#techGradient)" 
        filter="url(#dropShadow)"/>

  <rect x="26" y="14" width="8" height="8" transform="rotate(70 30 18)" fill="white" fill-opacity="0.95"/>
  
  <rect x="16" y="46" width="8" height="8" transform="rotate(45 20 50)" fill="white" fill-opacity="0.95"/>
  
  <rect x="26" y="78" width="8" height="8" transform="rotate(20 30 82)" fill="white" fill-opacity="0.95"/>

</svg>